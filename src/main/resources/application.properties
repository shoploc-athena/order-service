spring.application.name=order-service

# Database Configuration
# City from environment variable (CITY env var, default: lille for local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_${CITY:lille}}
spring.datasource.username=${DB_USER:shoploc}
spring.datasource.password=${DB_PASSWORD:shoploc}

# JPA/Hibernate Configuration
# ddl-auto = validate: Flyway manages schema, Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
# Locations: db/migration/ contains SQL scripts
# Out of order: false (strict ordering for safety)
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# Server Configuration
server.port=8080
